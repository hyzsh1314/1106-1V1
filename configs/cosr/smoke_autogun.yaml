schema_version: 1
scenario_id: COSR-AutoGun-smoke-v1
protocol_id: COSR-AutoGun-smoke-v1
protocol_version: "1"
protocol_status: SMOKE
scientific_protocol: false
purpose: smoke_test_only
smoke_restrictions:
  max_episodes: 8
  non_scientific_values: true
  formal_result_use: prohibited
physics:
  aircraft: F-16
  agents: 2
  dynamics: JSBSim_6DOF
  sim_freq_hz: 60
  control_interval_s: 0.2
  max_decision_steps: 20
  battle_field_center: {longitude_deg: 120.0, latitude_deg: 60.0, altitude_m: 0.0}
  reload_tolerance: {position_m: 25.0, altitude_m: 3.0, heading_rad: 0.03, speed_mps: 3.0, roll_rad: 0.03, pitch_rad: 0.03, p_rad_sec: 0.03, q_rad_sec: 0.03, r_rad_sec: 0.03}
action_interface: physical_continuous_v1
action_low: [-1.0, -1.0, -1.0, 0.4]
action_high: [1.0, 1.0, 1.0, 0.9]
utility: {win: 1, draw: 0, loss: -1}
# All values below are deliberately non-scientific smoke values. They provide
# executable coverage only and must never be reported as a paper protocol.
scenario:
  scenario_id: COSR-AutoGun-smoke-v1
  retry_limit: 100
  stratum_probabilities:
    balanced_head_on: 0.16666666666666666
    ego_advantage: 0.16666666666666666
    ego_disadvantage: 0.16666666666666666
    high_energy: 0.16666666666666666
    low_energy_low_altitude: 0.16666666666666666
    crossing_lateral: 0.16666666666666666
  geometry:
    limits:
      min_separation_m: 2000.0
      max_separation_m: 6000.0
      min_altitude_m: 1500.0
      max_altitude_m: 13000.0
      min_speed_mps: 120.0
      max_speed_mps: 450.0
      arena_half_extent_m: 50000.0
    neutral_state: {roll_rad: 0.0, pitch_rad: 0.0, p_rad_sec: 0.0, q_rad_sec: 0.0, r_rad_sec: 0.0}
  strata:
    balanced_head_on:
      separation_m: [3000.0, 5000.0]
      altitude_m: [4000.0, 6000.0]
      ego_speed_mps: [180.0, 220.0]
      opponent_speed_mps: [180.0, 220.0]
      heading_tolerance_deg: 5.0
    ego_advantage:
      separation_m: [3000.0, 5000.0]
      altitude_m: [4000.0, 6000.0]
      ego_speed_mps: [180.0, 220.0]
      opponent_speed_mps: [180.0, 220.0]
      heading_tolerance_deg: 5.0
      altitude_advantage_m: 500.0
    ego_disadvantage:
      separation_m: [3000.0, 5000.0]
      altitude_m: [4000.0, 6000.0]
      ego_speed_mps: [180.0, 220.0]
      opponent_speed_mps: [180.0, 220.0]
      heading_tolerance_deg: 5.0
      altitude_advantage_m: 500.0
    high_energy:
      separation_m: [3000.0, 5000.0]
      altitude_m: [9000.0, 11000.0]
      ego_speed_mps: [320.0, 360.0]
      opponent_speed_mps: [320.0, 360.0]
      heading_tolerance_deg: 5.0
    low_energy_low_altitude:
      separation_m: [3000.0, 5000.0]
      altitude_m: [1800.0, 2600.0]
      ego_speed_mps: [130.0, 170.0]
      opponent_speed_mps: [130.0, 170.0]
      heading_tolerance_deg: 5.0
    crossing_lateral:
      separation_m: [3000.0, 5000.0]
      altitude_m: [6500.0, 7500.0]
      ego_speed_mps: [230.0, 260.0]
      opponent_speed_mps: [230.0, 260.0]
      heading_tolerance_deg: 5.0
      crossing_heading_offset_deg: 90.0
autogun:
  enabled: true
  angle_envelope_deg: 30.0
  min_range_m: 250.0
  max_range_m: 6000.0
  dwell_s: 1.0
  damage_per_s: null
  damage_to_kill: null
  damage_mode: dwell_to_kill
  min_target_aspect_deg: 150.0
  max_target_aspect_deg: 180.0
  semantics: "red_in_envelope means red shooter; damage_to_blue is red-inflicted victim damage; red_kill means red aircraft destroyed"
safety:
  min_altitude_m: 1500.0
  max_overload_g: 9.0
  arena_half_extent_m: 50000.0
  collision_distance_m: 75.0
timeout: {result: draw}
training_reward:
  legacy_dense_enabled: true
  terminal_scale: 200.0
  non_scientific_value: true
training:
  gamma: 0.99
  gae_lambda: 0.95
  ppo_rollout_steps: 16
  ppo_epochs: 2
  ppo_minibatch_size: 32
  ppo_clip_ratio: 0.2
  ppo_value_coefficient: 0.5
  ppo_entropy_coefficient: 0.0
  ppo_max_grad_norm: 1.0
  batch_size: 32
  replay_capacity: 256
  warmup_steps: 32
  update_after: 32
  updates_per_step: 1
  sac_tau: 0.005
  sac_target_entropy: -4.0
  td3_tau: 0.005
  td3_policy_delay: 2
  td3_target_noise: 0.2
  td3_noise_clip: 0.5
  td3_exploration_noise: 0.1
  non_scientific_values: true
